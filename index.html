<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paşa Karaca | Hava Durumu</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0e2035;--line:#203954;--muted:#9bb2ca;--cyan:#64d9ff;--white:#f2f7ff}
*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--white);font:15px/1.45 Arial,Helvetica,sans-serif}#app{max-width:920px;margin:auto;padding:20px;border:1px solid #1d344d;border-radius:20px;background:radial-gradient(ellipse at 85% 0%,#123451 0,transparent 42%),var(--bg);box-shadow:0 16px 48px #0003}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:17px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--cyan);font-weight:700}.title{font-size:23px;font-weight:700;margin-top:5px}.sub{color:var(--muted);font-size:12px;margin-top:4px}select,button{background:#132a43;color:var(--white);border:1px solid #34516e;border-radius:10px;padding:11px 13px;font-size:14px}select{max-width:100%}.status{color:var(--muted);font-size:12px;padding-top:12px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;align-items:center;padding:26px 0}.city{font-size:14px;color:var(--muted)}.temp{font-size:clamp(55px,10vw,82px);font-weight:700;letter-spacing:-4px;line-height:1.1;margin:8px 0}.desc{font-size:17px}.feels{color:var(--muted);font-size:13px;margin-top:8px}.heroicon{text-align:center;font-size:70px;color:var(--cyan)}.heroicon small{display:block;font-size:12px;color:var(--muted);margin-top:8px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.metric,.day{background:linear-gradient(145deg,#122a43,#0b1a2b);border:1px solid var(--line);border-radius:13px;padding:15px;min-width:0}.label{font-size:11px;color:var(--muted);letter-spacing:.7px}.value{font-size:23px;font-weight:700;margin-top:9px;overflow-wrap:anywhere}.detail{font-size:12px;color:var(--muted);margin-top:5px}h3{font-size:16px;margin:25px 0 12px}.forecast{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.day{text-align:center;padding:13px 6px}.dayname{font-size:12px;color:#c5d8e9}.dayicon{font-size:27px;margin:12px 0}.daydesc{font-size:11px;color:var(--muted);min-height:29px}.high{font-size:17px;font-weight:700;margin-top:9px}.low{font-size:13px;color:var(--muted);margin-top:3px}.rain{font-size:11px;color:var(--cyan);margin-top:10px}.footer{border-top:1px solid var(--line);padding-top:12px;margin-top:22px;color:#829bb5;font-size:11px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.footer a{color:var(--cyan)}.error{padding:18px 0;color:#ffc4c4}
@media(max-width:520px){#app{padding:14px;border-radius:14px}.hero{grid-template-columns:1fr .6fr;gap:8px;padding:20px 0}.heroicon{font-size:48px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.forecast{grid-template-columns:repeat(2,minmax(0,1fr))}.day:last-child{grid-column:1/-1}.title{font-size:20px}}
</style></head><body>
<div id="app">
<div class="top"><div><div class="eyebrow">PAŞA KARACA · COĞRAFYA GAZETESİ</div><div class="title">Atmosfer <span style="color:var(--cyan)">/</span> Hava Durumu</div><div class="sub">Güncel koşullar ve 5 günlük tahmin</div></div>
<select id="city" aria-label="Şehir seç"><option value="39.9334,32.8597,Ankara">Ankara</option><option value="41.0082,28.9784,İstanbul">İstanbul</option><option value="38.4237,27.1428,İzmir">İzmir</option><option value="36.8969,30.7133,Antalya">Antalya</option><option value="40.1885,29.0610,Bursa">Bursa</option><option value="37,35.3213,Adana">Adana</option><option value="36.2021,36.1600,Hatay">Hatay</option><option value="39.7667,30.5256,Eskişehir">Eskişehir</option><option value="41.2867,36.3300,Samsun">Samsun</option><option value="38.7312,35.4787,Kayseri">Kayseri</option><option value="37.0662,37.3833,Gaziantep">Gaziantep</option><option value="41.0015,39.7178,Trabzon">Trabzon</option><option value="39.9043,41.2679,Erzurum">Erzurum</option></select></div>
<div id="status" class="status" aria-live="polite">Veriler yükleniyor…</div><div id="content"><p>Hava durumu verileri getiriliyor…</p></div>
<div class="footer"><span>Model tabanlı tahmin · Resmî uyarı yerine geçmez</span><span>Kaynak: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></span></div>
</div>
<script>
(()=>{const $=id=>document.getElementById(id),city=$('city'),status=$('status'),content=$('content');let seq=0;
function wx(c,day){if(c===0)return [day?'☀':'☾','Açık'];if(c===1)return ['◐','Az bulutlu'];if(c===2)return ['◒','Parçalı bulutlu'];if(c===3)return ['☁','Kapalı'];if([45,48].includes(c))return ['≋','Sisli'];if([51,53,55,56,57].includes(c))return ['☂','Çisenti'];if([61,63,65,66,67,80,81,82].includes(c))return ['☂','Yağmurlu'];if([71,73,75,77,85,86].includes(c))return ['❄','Karlı'];if([95,96,99].includes(c))return ['ϟ','Gök gürültülü'];return ['◌','Değişken'];}
function n(v){return Number.isFinite(v)?Math.round(v):null}function dir(d){return Number.isFinite(d)?['K','KD','D','GD','G','GB','B','KB'][Math.round(d/45)%8]:'—'}
function dateLabel(s){return new Intl.DateTimeFormat('tr-TR',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}).format(new Date(s+'T12:00:00Z'))}
async function load(){const id=++seq,[lat,lon,name]=city.value.split(',');status.textContent=name+' · Veriler güncelleniyor';content.innerHTML='<p>Yükleniyor…</p>';const p=new URLSearchParams({latitude:lat,longitude:lon,timezone:'auto',forecast_days:'5',wind_speed_unit:'kmh',current:'temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m,wind_direction_10m',hourly:'precipitation_probability',daily:'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max'});try{const r=await fetch('https://api.open-meteo.com/v1/forecast?'+p);if(!r.ok)throw Error('API');const data=await r.json();if(id!==seq)return;const c=data.current,d=data.daily,h=data.hourly;let hi=-1,delta=Infinity;h.time.forEach((t,i)=>{const diff=Math.abs(new Date(t).getTime()-new Date(c.time).getTime());if(diff<delta){delta=diff;hi=i}});const rain=hi>=0&&delta<=3600000?h.precipitation_probability[hi]:null;const cur=wx(c.weather_code,c.is_day===1);content.innerHTML=`<section class="hero"><div><div class="city">${name} · Modelin güncel koşulları</div><div class="temp">${n(c.temperature_2m)??'—'}°</div><div class="desc">${cur[1]}</div><div class="feels">Hissedilen ${n(c.apparent_temperature)??'—'}°C</div></div><div class="heroicon">${cur[0]}<small>HAVA KOŞULLARI</small></div></section><section class="metrics"><div class="metric"><div class="label">BAĞIL NEM · 2 M</div><div class="value">${n(c.relative_humidity_2m)??'—'}%</div><div class="detail">Modelin güncel değeri</div></div><div class="metric"><div class="label">RÜZGÂR · 10 M</div><div class="value">${n(c.wind_speed_10m)??'—'} <span style="font-size:12px">km/sa</span></div><div class="detail">Yön: ${dir(c.wind_direction_10m)} (${n(c.wind_direction_10m)??'—'}°)</div></div><div class="metric"><div class="label">YAĞIŞ OLASILIĞI</div><div class="value">${rain==null?'—':Math.round(rain)+'%'}</div><div class="detail">En yakın saatlik tahmin</div></div></section><h3>5 günlük tahmin</h3><section class="forecast">${d.time.map((date,i)=>{const w=wx(d.weather_code[i],true),a=n(d.temperature_2m_max[i]),b=n(d.temperature_2m_min[i]),rp=d.precipitation_probability_max[i],ws=n(d.wind_speed_10m_max[i]);return `<div class="day"><div class="dayname">${dateLabel(date)}</div><div class="dayicon">${w[0]}</div><div class="daydesc">${w[1]}</div><div class="high">${a==null?'—':a+'°'}</div><div class="low">${b==null?'—':b+'°'}</div><div class="rain">Yağış ${rp==null?'—':Math.round(rp)+'%'}</div><div class="detail">Rüzgâr ${ws==null?'—':ws+' km/sa'}</div></div>`}).join('')}</section>`;status.textContent='Veri zamanı: '+c.time.replace('T',' ')+' · Saat dilimi: '+data.timezone+' · Otomatik yenileme: 15 dk';}catch(e){if(id!==seq)return;status.textContent='Veri bağlantısı kurulamadı';content.innerHTML='<div class="error">Veriler yüklenemedi. İnternet bağlantısını kontrol edip yeniden deneyin.</div><button id="retry">Tekrar dene</button>';$('retry').onclick=load;}}
city.addEventListener('change',load);load();setInterval(load,900000);})();
</script></body></html>
